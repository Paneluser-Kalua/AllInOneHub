<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kalua Mega API Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030305;
      --primary: #00f0ff;
      --secondary: #8a2be2;
      --surface: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-dim: #8b8b99;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100dvh; background-color: var(--bg); color: var(--text); overflow: hidden; position: fixed; }
    .bg-glow { position: absolute; width: 150vw; height: 150vw; background: radial-gradient(circle, rgba(138,43,226,0.15) 0%, rgba(0,240,255,0.05) 40%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: -1; }
    .glass { background: var(--surface); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    #lockUI { position: absolute; inset: 0; z-index: 100; display: flex; justify-content: center; align-items: center; padding: 20px; background: var(--bg); }
    .lock-card { width: 100%; max-width: 320px; padding: 30px 20px; text-align: center; display: flex; flex-direction: column; gap: 20px; }
    .lock-card h1 { font-size: 24px; font-weight: 700; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; color: transparent; }
    .input-box { width: 100%; padding: 14px; background: rgba(0,0,0,0.6); border: 1px solid var(--border); border-radius: 14px; color: var(--text); font-size: 14px; text-align: center; outline: none; transition: 0.3s; }
    .input-box:focus { border-color: var(--primary); box-shadow: 0 0 12px rgba(0,240,255,0.2); }
    .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #000; font-size: 14px; font-weight: 700; border: none; border-radius: 14px; text-transform: uppercase; cursor: pointer; }
    .btn:active { transform: scale(0.96); }
    #appUI { display: none; flex-direction: column; height: 100dvh; padding: 15px 20px; gap: 12px; overflow-y: auto; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .header h2 { font-size: 16px; font-weight: 700; }
    .badge { background: rgba(0, 136, 204, 0.1); color: #0088cc; padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; border: 1px solid rgba(0, 136, 204, 0.3); text-decoration: none; display: flex; align-items: center; gap: 5px; }
    .main-card { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .segments { display: flex; background: rgba(0,0,0,0.5); border-radius: 12px; padding: 4px; border: 1px solid var(--border); }
    .seg-btn { flex: 1; padding: 10px 0; text-align: center; font-size: 11px; font-weight: 600; color: var(--text-dim); border-radius: 9px; cursor: pointer; transition: 0.3s; }
    .seg-btn.active { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    select.input-box { text-align-last: center; }
    #formView { display: flex; flex-direction: column; gap: 12px; }
    #resultView { display: none; flex-direction: column; gap: 12px; animation: slideUp 0.3s ease; }
    .result-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(0,240,255,0.3); border-radius: 12px; padding: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .res-data { flex: 1; overflow: hidden; }
    .res-label { font-size: 10px; color: var(--primary); text-transform: uppercase; margin-bottom: 3px; letter-spacing: 1px; }
    .res-value { font-family: monospace; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .copy-btn { background: var(--surface); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; color: var(--text); font-size: 11px; font-weight: 600; cursor: pointer; }
    .footer-info { text-align: center; font-size: 11px; color: var(--text-dim); padding: 10px; background: rgba(0,0,0,0.3); border-radius: 10px; border: 1px solid var(--border); }
    .footer-info .dev-name { color: #ffffff; font-weight: 700; }
    .footer-info .endpoint-text { font-family: monospace; color: var(--primary); margin-top: 4px; display: block; font-size: 9px; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="bg-glow"></div>
<div id="lockUI">
  <div class="glass lock-card">
    <h1>KALUA API HUB</h1>
    <input type="password" id="passInput" class="input-box" placeholder="Enter Password" onkeydown="if(event.key==='Enter')unlock()">
    <button class="btn" onclick="unlock()" id="unlockBtn">Access Hub</button>
  </div>
</div>
<div id="appUI">
  <div class="header">
    <h2>MEGA<span style="color:var(--primary)"> API HUB </span></h2>
    <a href="https://t.me/KaluaApiStore" target="_blank" class="badge">KaluaApiStore</a>
  </div>
  <div class="glass main-card">
    <div id="formView">
      <div class="segments">
        <div class="seg-btn active" onclick="setPlan(this, '3d')">3 Days</div>
        <div class="seg-btn" onclick="setPlan(this, 'week')">1 Week</div>
        <div class="seg-btn" onclick="setPlan(this, 'life')">Lifetime</div>
      </div>
      <select id="apiType" class="input-box">
        <option value="vehicle-full">Vehicle Full Info</option>
        <option value="vehicle-to-number">Vehicle to Number</option>
        <option value="aadhaar2pan">Aadhaar to PAN</option>
        <option value="aadhaar2num">Aadhaar to Number</option>
        <option value="challan">Vehicle to Challan</option>
        <option value="pan2dob">PAN to Name / DOB</option>
      </select>
      <input type="text" id="devName" class="input-box" placeholder="Your Username" autocomplete="off">
      <button class="btn" onclick="generate()">Generate API Key & URL</button>
    </div>
    <div id="resultView">
      <h3 style="color:var(--primary); text-align:center; font-size:16px;">Key Generated Successfully</h3>
      <div class="result-box">
        <div class="res-data">
          <div class="res-label">API Key</div>
          <div class="res-value" id="valKey">...</div>
        </div>
        <button class="copy-btn" onclick="copyData('valKey', this)">Copy</button>
      </div>
      <div class="result-box">
        <div class="res-data">
          <div class="res-label">Ready Endpoint</div>
          <div class="res-value" id="valUrl">...</div>
        </div>
        <button class="copy-btn" onclick="copyData('valUrl', this)">Copy</button>
      </div>
      <button class="btn" onclick="resetUI()" style="background: var(--surface); color: var(--text); border: 1px solid var(--border);">Create Another</button>
    </div>
  </div>
  <div class="footer-info">
    Developer: <span class="dev-name">KaluaApiAdmin</span> | Channel: <span class="dev-name">KaluaApiStore</span>
  </div>
</div>
<script>
const PASS = "KaluaApiHub";
const SESSION = "kalua_hub_auth_v5";
let activePlan = '3d';
window.onload = () => {
  if (sessionStorage.getItem(SESSION) === "true") {
    document.getElementById('lockUI').style.display = 'none';
    document.getElementById('appUI').style.display = 'flex';
  }
};
function unlock() {
  const input = document.getElementById('passInput');
  const btn = document.getElementById('unlockBtn');
  if(input.value === PASS) {
    sessionStorage.setItem(SESSION, "true");
    btn.innerHTML = "VERIFIED ✓";
    btn.style.background = "var(--primary)";
    btn.style.color = "#000";
    setTimeout(() => {
      document.getElementById('lockUI').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('lockUI').style.display = 'none';
        document.getElementById('appUI').style.display = 'flex';
      }, 300);
    }, 400);
  } else {
    input.value = "";
    input.placeholder = "Wrong Password!";
    input.style.borderColor = "#ff4444";
    setTimeout(() => input.style.borderColor = "var(--border)", 1000);
  }
}
function setPlan(el, plan) {
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  activePlan = plan;
}
function generate() {
  const user = document.getElementById('devName').value.trim() || 'USER';
  const apiType = document.getElementById('apiType').value;
  const rand = Math.random().toString(36).slice(2, 7).toUpperCase();
  const pre = activePlan === 'life' ? 'LIFE' : activePlan === 'week' ? 'W1' : 'D3';
  const finalKey = `KALUA-${pre}-${user.slice(0,5).toUpperCase()}-${rand}`;
  const paramKey = apiType.includes('aadhaar') ? 'aadhaar' : apiType.includes('pan') ? 'pan' : 'vehicle';
  const sampleVal = apiType.includes('aadhaar') ? 'XXXXXXXXXXXX' : apiType.includes('pan') ? 'ABCDE1234F' : 'KL41V3504';
  const finalUrl = `${window.location.origin}/api/${apiType}/${finalKey}?${paramKey}=${sampleVal}`;
  document.getElementById('valKey').innerText = finalKey;
  document.getElementById('valUrl').innerText = finalUrl;
  document.getElementById('formView').style.display = 'none';
  document.getElementById('resultView').style.display = 'flex';
}
function resetUI() {
  document.getElementById('resultView').style.display = 'none';
  document.getElementById('formView').style.display = 'flex';
}
function copyData(id, btn) {
  const txt = document.getElementById(id).innerText;
  navigator.clipboard.writeText(txt).then(() => {
    const oldTxt = btn.innerText;
    btn.innerText = "COPIED";
    btn.style.background = "var(--primary)";
    btn.style.color = "#000";
    setTimeout(() => {
      btn.innerText = oldTxt;
      btn.style.background = "var(--surface)";
      btn.style.color = "var(--text)";
    }, 1500);
  });
}
</script>
</body>
</html>
